# Фрагмент для server { ... } на lite-pack.ru — новая версия фронтенда.
# Существующие location для /api/, /static/ и сервиса ресайза /(80|180|506),fit/ НЕ трогаем:
# ниже только статика нового сайта и рекомендованные улучшения.

root /var/www/lite-pack/dist;          # содержимое папки dist после `npm run build`

# Сжатие статики (gzip уже есть на сервере — проверить, что включены типы ниже)
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;

# Хешированные файлы сборки — кэш на год
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Картинки первого экрана и бренда
location ~ ^/(hero|brand)/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}

# Улучшенные фото товаров (npm run images): имя файла = id фото в хранилище, содержимое не меняется — кэш на месяц.
# Если файла нет (товар добавлен после сборки) — честный 404, сайт сам переключится на сервис ресайза.
location /pimg/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

# Страницы: сначала пререндер (dist/category/<id>/index.html и т.п.), иначе — оболочка SPA app.html
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /app.html;
}

# ── Рекомендации к существующим location (дают основной прирост скорости) ──
#
# 1) Сжатие ответов API: /api/v1/categories весит 170 КБ и сейчас отдаётся без gzip.
#    В location /api/ добавить:
#        gzip on; gzip_proxied any; gzip_types application/json;
#
# 2) Кэш сервиса ресайза картинок (сейчас каждая картинка генерируется заново, 0,3–3 с):
#    proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:50m max_size=2g inactive=30d;
#    location ~ ^/(80|180|506),fit/ {
#        proxy_cache img; proxy_cache_valid 200 30d; proxy_cache_use_stale error timeout updating;
#        add_header Cache-Control "public, max-age=2592000";
#        ... существующий proxy_pass ...
#    }
#
# 3) В идеале сервис ресайза должен отдавать WebP/AVIF и размер ~320 px — это снимет LCP ниже 2,5 с на мобильных.
